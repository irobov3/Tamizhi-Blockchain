run:
  timeout: 10m
  modules-download-mode: readonly

linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - misspell
    - gocritic
    - noctx

linters-settings:
  gocritic:
    disabled-checks:
      - ifElseChain

issues:
  exclude-rules:
    - path: "_test.go"
      linters:
        - errcheck
    - path: "vendor/"
      linters:
        - all
  max-issues-per-linter: 50
  max-same-issues: 10
