###############################################################################
###                         State Sync Configuration                        ###
###############################################################################
# Add to your config.toml [statesync] section

[statesync]
# State sync enabled
enable = true

# Comma-separated list of trusted RPC endpoints that provide snapshots
rpc_servers = "http://rpc1.testnet.tamizhi.ai:26657,http://rpc2.testnet.tamizhi.ai:26657"

# Trusted block height from a recent snapshot
# Get with: curl -s $RPC/block | jq '.result.block.header.height'
# Then subtract 1000 and get the hash at that height
trust_height = 0

# Hash of the trusted block (get from: curl -s $RPC/block?height=$TRUST_HEIGHT)
trust_hash = ""

# How long to trust a snapshot: set to 2x the unbonding period
trust_period = "336h0m0s"  # 14 days (2x the 7-day unbonding)

# Fetchers: number of parallel goroutines fetching snapshot chunks
fetchers = "4"

# Chunk request timeout
chunk_request_timeout = "10s"

# Discovery time: max time to discover snapshots
discovery_time = "15s"

# Temp dir for downloading chunks
temp_dir = ""

# P2P chunk fetch max size (10MB)
chunk_fetchers = "4"
