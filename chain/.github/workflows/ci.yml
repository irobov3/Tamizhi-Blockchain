name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/tamizhi-chain

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.58
          args: --timeout=10m --out-format=github-actions ./x/... ./app/...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build binary
        run: CGO_ENABLED=0 go build -o build/tamizhi ./cmd/tamizhi
      - name: Build modules
        run: CGO_ENABLED=0 go build ./x/rewards/... ./x/nodes/... ./x/accesslog/... ./x/security/... ./x/messaging/... ./x/identity/... ./x/literature/... ./x/nft/...
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tamizhi-binary
          path: build/tamizhi
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - ./x/rewards/...
          - ./x/nodes/...
          - ./x/accesslog/...
          - ./x/security/...
          - ./x/messaging/...
          - ./x/identity/...
          - ./x/literature/...
          - ./x/nft/...
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run tests
        run: |
          CGO_ENABLED=0 go test ${{ matrix.package }} \
            -count=1 -timeout 10m -p 1 \
            -coverprofile=coverage.out \
            -covermode=atomic
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.out
          flags: ${{ matrix.package }}
        continue-on-error: true

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run benchmarks
        run: |
          CGO_ENABLED=0 go test ./x/rewards/keeper/... ./x/nodes/keeper/... \
            -run='^$' -bench=. -benchmem -count=3 \
            -timeout 15m | tee benchmark.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.txt

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}},event=tag
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
