name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  GO_VERSION: "1.22"

jobs:
  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary (${{ matrix.suffix }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse HEAD)"
          LDFLAGS="-s -w \
            -X github.com/cosmos/cosmos-sdk/version.Name=tamizhi \
            -X github.com/cosmos/cosmos-sdk/version.AppName=tamizhi \
            -X github.com/cosmos/cosmos-sdk/version.Version=${VERSION} \
            -X github.com/cosmos/cosmos-sdk/version.Commit=${COMMIT}"
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "${LDFLAGS}" \
            -o "dist/tamizhi-${{ matrix.suffix }}" \
            ./cmd/tamizhi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamizhi-${{ matrix.suffix }}
          path: dist/tamizhi-${{ matrix.suffix }}
          retention-days: 1

  checksums:
    name: Create Checksums
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: tamizhi-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum tamizhi-* > checksums.txt
          cat checksums.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt
          retention-days: 1

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: checksums
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: tamizhi-*
          path: dist
          merge-multiple: true

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: dist

      - name: Extract release notes from CHANGELOG
        id: release_notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # Try to extract version-specific notes from CHANGELOG.md if it exists
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[?${VERSION//v/}\]?/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md > release_notes.txt
          fi
          if [ ! -s release_notes.txt ]; then
            echo "Release ${VERSION}" > release_notes.txt
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Tamizhi ${{ github.ref_name }}
          body_path: release_notes.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/tamizhi-linux-amd64
            dist/tamizhi-linux-arm64
            dist/tamizhi-darwin-amd64
            dist/tamizhi-darwin-arm64
            dist/checksums.txt
