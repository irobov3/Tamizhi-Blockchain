[package]
name = "access_control"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
backtraces = ["cosmwasm-std/backtraces"]
library = []

[dependencies]
cosmwasm-std    = { version = "1.5.0", features = ["stargate"] }
cosmwasm-schema = "1.5.0"
cw-storage-plus = "1.2.0"
cw2             = "1.1.2"
schemars        = "0.8"
serde           = { version = "1.0", default-features = false, features = ["derive"] }
thiserror       = "1.0"

[dev-dependencies]
cw-multi-test = "0.20"
