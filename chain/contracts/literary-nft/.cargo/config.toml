[alias]
wasm        = "build --release --lib --target wasm32-unknown-unknown"
wasm-debug  = "build --lib --target wasm32-unknown-unknown"
schema      = "run --bin schema"

# Rust 1.81 required: cosmwasm-std 2.1.3 is pinned to avoid edition2024 deps (rmp-serde).
# cosmwasm-vm 2.1.x rejects bulk-memory, mutable-globals, and sign-ext — disable them all.
[toolchain]
channel = "1.81"

[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "link-arg=-s",
    "-C", "target-feature=-bulk-memory,-mutable-globals,-sign-ext",
]

[http]
check-revoke = false
ssl-version  = "tlsv1.2"
