[package]
name = "tamizhi-rewards-escrow"
version = "0.1.0"
authors = ["Tamizhi Team <dev@tamizhi.ai>"]
edition = "2021"
description = "Tamizhi rewards escrow contract for milestone bonuses"
license = "Apache-2.0"
repository = "https://github.com/tamizhi/chain"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true

[features]
library = []

[dependencies]
cosmwasm-std = { version = "2.1.4", features = ["cosmwasm_2_0"] }
cosmwasm-schema = "2.1.4"
cw-storage-plus = "2.0.0"
serde = { version = "1.0.203", features = ["derive"] }
thiserror = "1.0.61"

[dev-dependencies]
cosmwasm-vm = { version = "2.1.4", features = ["iterator"] }
