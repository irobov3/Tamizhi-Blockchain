replicaCount: 1

image:
  repository: ghcr.io/tamizhi/chain
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

node:
  chainID: "tamizhi-testnet-1"
  moniker: "tamizhi-node"
  keyringBackend: "file"
  homeDir: "/home/tamizhi/.tamizhi"

service:
  type: ClusterIP
  p2pPort: 26656
  rpcPort: 26657
  restPort: 1317
  grpcPort: 9090

# Expose P2P via LoadBalancer for external validators
p2pService:
  enabled: true
  type: LoadBalancer
  port: 26656

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 100Gi

livenessProbe:
  httpGet:
    path: /health
    port: 26657
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 26657
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

config:
  rpc:
    cors_allowed_origins: '["*"]'
  api:
    enable: true
    swagger: false
    enabled_unsafe_cors: false
  grpc:
    enable: true

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "26660"
  prometheus.io/path: "/metrics"

serviceAccount:
  create: true
  name: ""
