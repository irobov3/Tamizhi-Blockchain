apiVersion: v1
kind: Service
metadata:
  name: {{ include "tamizhi-chain.fullname" . }}
  labels:
    {{- include "tamizhi-chain.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.rpcPort }}
      targetPort: rpc
      protocol: TCP
      name: rpc
    - port: {{ .Values.service.restPort }}
      targetPort: rest
      protocol: TCP
      name: rest
    - port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "tamizhi-chain.selectorLabels" . | nindent 4 }}
---
{{- if .Values.p2pService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tamizhi-chain.fullname" . }}-p2p
  labels:
    {{- include "tamizhi-chain.labels" . | nindent 4 }}
spec:
  type: {{ .Values.p2pService.type }}
  ports:
    - port: {{ .Values.p2pService.port }}
      targetPort: p2p
      protocol: TCP
      name: p2p
  selector:
    {{- include "tamizhi-chain.selectorLabels" . | nindent 4 }}
{{- end }}
