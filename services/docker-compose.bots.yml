version: "3.8"
services:
  discord-bot:
    build:
      context: ./discord-bot
    env_file: ./discord-bot/.env
    environment:
      REST_URL: http://host.docker.internal:1317
      EXPLORER_URL: http://host.docker.internal:3001
      WS_RELAY_URL: ws://host.docker.internal:3002
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./telegram-bot
    env_file: ./telegram-bot/.env
    environment:
      REST_URL: http://host.docker.internal:1317
      EXPLORER_URL: http://host.docker.internal:3001
    restart: unless-stopped
