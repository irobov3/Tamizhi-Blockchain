# ============================================================
# Tamizhi Platform — Shared Secrets Template
#
# IMPORTANT: This file contains PLACEHOLDER values only.
#            Never commit real secrets to version control.
#
# Before deploying, replace every <base64-encoded-value>
# placeholder with the actual base64-encoded secret:
#
#   echo -n 'your-actual-value' | base64
#
# Then apply with:
#   kubectl apply -f infra/k8s/secrets.yaml
#
# For production, prefer an external secret manager:
#   - Kubernetes External Secrets Operator (ESO)
#   - Sealed Secrets (Bitnami)
#   - HashiCorp Vault Agent Injector
#   - AWS Secrets Manager / GCP Secret Manager
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: tamizhi-secrets
  namespace: tamizhi
  labels:
    app.kubernetes.io/name: tamizhi-secrets
    app.kubernetes.io/part-of: tamizhi
  annotations:
    # Remind operators this file must be populated before apply
    tamizhi.network/managed-by: "manual"
    tamizhi.network/rotate-reminder: "Rotate secrets every 90 days"
type: Opaque
data:
  # ── JWT_SECRET ─────────────────────────────────────────────
  # Generate: openssl rand -hex 64 | tr -d '\n' | base64
  JWT_SECRET: <base64-encoded-value>

  # ── ANTHROPIC_API_KEY ──────────────────────────────────────
  # Obtain from: https://console.anthropic.com/account/keys
  # Encode: echo -n 'sk-ant-api03-...' | base64
  ANTHROPIC_API_KEY: <base64-encoded-value>

  # ── DB_PASSWORD ────────────────────────────────────────────
  # Must match POSTGRES_PASSWORD used in postgres.yaml / ConfigMap
  # Generate: openssl rand -base64 32 | tr -d '\n' | base64
  DB_PASSWORD: <base64-encoded-value>

---
# ─────────────────────────────────────────
# PostgreSQL Secret (overrides postgres.yaml stringData
# when deploying with real credentials)
# ─────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: tamizhi
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: tamizhi
type: Opaque
data:
  # echo -n 'your-db-password' | base64
  POSTGRES_PASSWORD: <base64-encoded-value>
  # echo -n 'postgresql://tamizhi:your-db-password@postgres-service:5432/tamizhi' | base64
  DATABASE_URL: <base64-encoded-value>
