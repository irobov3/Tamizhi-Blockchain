# ─────────────────────────────────────────
# Backend API — Secret
# ─────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: tamizhi
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: tamizhi-ecosystem
type: Opaque
stringData:
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
  DATABASE_URL: "postgresql://tamizhi:tamizhi_secret@postgres-service:5432/tamizhi"

---
# ─────────────────────────────────────────
# Backend API — ConfigMap
# ─────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: tamizhi
  labels:
    app: backend
data:
  PORT: "3000"
  NODE_ENV: "production"
  REDIS_URL: "redis://redis-service:6379"
  CHAIN_RPC_URL: "http://chain-service:26657"
  CHAIN_LCD_URL: "http://chain-service:1317"
  CHAIN_ID: "tamizhi-1"
  IPFS_API_URL: "http://ipfs-service:5001"
  IPFS_GATEWAY: "http://ipfs-service:8080/ipfs"

---
# ─────────────────────────────────────────
# Backend API — Deployment
# ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tamizhi
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: tamizhi-ecosystem
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - backend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: tamizhi/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
      terminationGracePeriodSeconds: 30

---
# ─────────────────────────────────────────
# Backend API — Service
# ─────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: tamizhi
  labels:
    app: backend
    app.kubernetes.io/name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP

---
# ─────────────────────────────────────────
# Backend API — HorizontalPodAutoscaler
# Scales on CPU (70%) and memory (80%)
# ─────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: tamizhi
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: tamizhi-ecosystem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
