    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://tamizhi.network"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization"
spec:
  tls:
    - hosts:
        - api.tamizhi.network
      secretName: api-tamizhi-network-tls
  rules:
    - host: api.tamizhi.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3001

---
# ─────────────────────────────────────────
# Chain RPC Ingress — rpc.tamizhi.network
# ─────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chain-rpc-ingress
  namespace: tamizhi
  labels:
    app: chain
    app.kubernetes.io/name: chain
    app.kubernetes.io/part-of: tamizhi
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    # WebSocket support for CometBFT subscriptions
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  tls:
    - hosts:
        - rpc.tamizhi.network
      secretName: rpc-tamizhi-network-tls
  rules:
    - host: rpc.tamizhi.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chain-service
                port:
                  number: 26657

