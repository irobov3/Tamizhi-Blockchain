# ============================================================
# Tamizhi Platform — nginx Ingress
# Prerequisites:
#   - nginx Ingress Controller installed in the cluster
#   - cert-manager installed with a ClusterIssuer named "letsencrypt-prod"
#
# Routing map:
#   tamizhi.network         → web service       (port 3000)
#   api.tamizhi.network     → backend service   (port 3001)
#   rpc.tamizhi.network     → chain rpc         (port 26657)
#   rest.tamizhi.network    → chain rest        (port 1317)
#   ai.tamizhi.network      → ai service        (port 8000)
#   msg.tamizhi.network     → messaging         (port 4000, WebSocket)
#   storage.tamizhi.network → storage service   (port 5000)
# ============================================================

# ─────────────────────────────────────────
# Web App Ingress — tamizhi.network
# ─────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
  namespace: tamizhi
  labels:
    app: web
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: tamizhi
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://tamizhi.network"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization"
spec:
  tls:
    - hosts:
        - tamizhi.network
      secretName: tamizhi-network-tls
  rules:
    - host: tamizhi.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 3000

---
# ─────────────────────────────────────────
# Backend API Ingress — api.tamizhi.network
# ─────────────────────────────────────────
apiVersion: networking.k8s.io/v1
