# ============================================================
# Tamizhi AI Service (FastAPI) — Kubernetes Manifests
# Includes: ConfigMap, Deployment, Service, HPA
# ============================================================

# ─────────────────────────────────────────
# AI Service — ConfigMap
# ─────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-config
  namespace: tamizhi
  labels:
    app.kubernetes.io/name: ai
    app.kubernetes.io/part-of: tamizhi
data:
  PORT: "8000"
  REDIS_URL: "redis://redis-service:6379"
  CHAIN_REST: "http://chain-service:1317"
  CHAIN_ID: "tamizhi-1"

---
# ─────────────────────────────────────────
# AI Service — Deployment
# ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: tamizhi
  labels:
    app: ai
    app.kubernetes.io/name: ai
    app.kubernetes.io/part-of: tamizhi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai
        app.kubernetes.io/name: ai
        app.kubernetes.io/part-of: tamizhi
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - ai
                topologyKey: kubernetes.io/hostname
      containers:
        - name: ai
          image: tamizhi/ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-config
          env:
            # Anthropic API key from Secret
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tamizhi-secrets
                  key: ANTHROPIC_API_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
      terminationGracePeriodSeconds: 30

---
# ─────────────────────────────────────────
# AI Service — ClusterIP Service
# ─────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: tamizhi
  labels:
    app: ai
    app.kubernetes.io/name: ai
    app.kubernetes.io/part-of: tamizhi
spec:
  type: ClusterIP
  selector:
    app: ai
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

---
# ─────────────────────────────────────────
# AI Service — HorizontalPodAutoscaler
# Scales on CPU (70%): min 2, max 8 replicas
# ─────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-hpa
  namespace: tamizhi
  labels:
    app: ai
    app.kubernetes.io/name: ai
    app.kubernetes.io/part-of: tamizhi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
