<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Core Dark Gradient Background -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0D0E15" />
      <stop offset="100%" stop-color="#040508" />
    </radialGradient>
    
    <!-- Cyber Teal Glow -->
    <radialGradient id="glow-teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
    
    <!-- Spiritual Gold Glow -->
    <radialGradient id="glow-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Purple Accent Glow -->
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7000FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0" />
    </radialGradient>

    <!-- Futuristic Hex Grid Pattern -->
    <pattern id="hex-grid" width="100" height="173.2" patternUnits="userSpaceOnUse" patternTransform="scale(0.6)">
      <path d="M50 0 L100 28.87 L100 86.6 L50 115.47 L0 86.6 L0 28.87 Z" fill="none" stroke="rgba(0, 240, 255, 0.03)" stroke-width="1.5"/>
      <path d="M50 173.2 L100 144.33 L100 86.6 L50 115.47 L0 86.6 L0 144.33 Z" fill="none" stroke="rgba(0, 240, 255, 0.03)" stroke-width="1.5"/>
    </pattern>

    <!-- Data Nodes / Dot Pattern -->
    <pattern id="dot-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="1" fill="rgba(255, 184, 0, 0.15)" />
    </pattern>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="150"/>
    </filter>
  </defs>

  <!-- Base Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  
  <!-- Ambient Lighting -->
  <circle cx="20%" cy="30%" r="600" fill="url(#glow-teal)" filter="url(#blur)" />
  <circle cx="85%" cy="80%" r="700" fill="url(#glow-gold)" filter="url(#blur)" />
  <circle cx="75%" cy="15%" r="500" fill="url(#glow-purple)" filter="url(#blur)" />
  <circle cx="10%" cy="90%" r="400" fill="url(#glow-teal)" filter="url(#blur)" opacity="0.6"/>

  <!-- Texture Layers -->
  <rect width="100%" height="100%" fill="url(#hex-grid)" />
  <rect width="100%" height="100%" fill="url(#dot-grid)" />

  <!-- Blockchain / Network Abstraction -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5" fill="none">
    <path d="M-100 400 L200 350 L450 600 L800 500 L1100 700 L1400 450 L1700 800 L2000 650" />
    <path d="M-50 800 L300 750 L600 950 L950 850 L1250 1000 L1600 900 L1950 1050" />
    <path d="M100 150 L500 250 L850 100 L1200 300 L1550 150 L1850 350" />
  </g>

  <!-- Glowing Intersection Nodes -->
  <g fill="#00F0FF" opacity="0.8">
    <circle cx="200" cy="350" r="3" />
    <circle cx="800" cy="500" r="4" />
    <circle cx="1400" cy="450" r="5" />
    <circle cx="1200" cy="300" r="3" />
    <circle cx="500" cy="250" r="4" />
  </g>

  <g fill="#FFB800" opacity="0.8">
    <circle cx="450" cy="600" r="4" />
    <circle cx="1100" cy="700" r="5" />
    <circle cx="1700" cy="800" r="4" />
    <circle cx="600" cy="950" r="3" />
    <circle cx="1250" cy="1000" r="4" />
    <circle cx="1600" cy="900" r="3" />
    <circle cx="850" cy="100" r="4" />
    <circle cx="1550" cy="150" r="3" />
  </g>

  <!-- Subtle connecting lines between different paths -->
  <g stroke="rgba(255, 184, 0, 0.05)" stroke-width="1" stroke-dasharray="5,5" fill="none">
     <line x1="450" y1="600" x2="500" y2="250" />
     <line x1="800" y1="500" x2="850" y2="100" />
     <line x1="1100" y1="700" x2="1250" y2="1000" />
     <line x1="1400" y1="450" x2="1600" y2="900" />
  </g>
</svg>
